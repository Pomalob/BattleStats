<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>StatsBattle — Аналитика</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f6feb'/%3E%3Cg fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='6'/%3E%3Cpath d='M12 4v3M12 17v3M4 12h3M17 12h3'/%3E%3C/g%3E%3Ccircle cx='12' cy='12' r='1.8' fill='white'/%3E%3C/svg%3E" />
<meta name="theme-color" content="#0d1117" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/app.css" />
<style>
  .hidden-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border-muted);
    border-left: 2px solid var(--border-strong);
    border-radius: 0 var(--radius) var(--radius) 0; padding: 11px 14px; margin-bottom: 16px;
  }
  .hidden-label {
    font-family: var(--font-display); font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.09em;
  }
  .filter-group { display: flex; align-items: center; gap: 8px; }
  .filter-label {
    font-family: var(--font-display); font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.09em; white-space: nowrap;
  }
  .vehicle-name { font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono); }
  .cell-date { color: var(--text-muted); font-size: 12px; }
  .cell-file {
    color: var(--text-dim); font-size: 11px; max-width: 220px;
    overflow: hidden; text-overflow: ellipsis;
  }
  td.col-vehicle { text-align: left; padding-left: 12px; }
  th.col-vehicle { text-align: left; padding-left: 12px; }
  .wr-cell { min-width: 120px; padding: 8px 12px; }
</style>
</head>
<body>
<div class="page">

  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8" stroke="#fff" stroke-width="1.5" opacity="0.95"/>
          <circle cx="12" cy="12" r="2" fill="#fff"/>
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-title">Stats<span class="accent">Battle</span></span>
        <span class="brand-sub">Мир Танков · Replay Analyzer</span>
      </span>
    </a>

    <nav class="nav-links">
      <a href="/" class="nav-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Быстрый чек
      </a>
      <a href="/analytics" class="nav-link active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Аналитика
      </a>
    </nav>

    <div class="header-right">
      <div class="segmented" id="scope" role="tablist" aria-label="Охват">
        <button type="button" role="tab" data-scope="all"  aria-selected="true">Все бои</button>
        <button type="button" role="tab" data-scope="mine" aria-selected="false">Мои бои</button>
      </div>
      <span class="user-pill idle" id="user-pill"><span id="user-name">—</span></span>
      <button class="btn btn-ghost btn-sm" id="btn-logout">Выйти</button>
    </div>
  </header>

  <div id="content">
    <div class="spinner-wrap"><div class="spinner"></div> Загружаем данные…</div>
  </div>

</div>

<script>
  const _token = localStorage.getItem('sb_token');
  if (!_token) window.location.href = '/login';

  const _username = localStorage.getItem('sb_username') ?? '';
  let _mineOnly = false;

  // Player, map and vehicle names come from replay files, so never trust them as markup.
  const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ESCAPES[c]);

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { ...(options.headers ?? {}), 'Authorization': `Bearer ${_token}` },
    });
    if (res.status === 401) { logout(); throw new Error('Сессия истекла'); }
    return res;
  }

  const contentEl = document.getElementById('content');

  const DETAILS = { vehicles: 'Танки', maps: 'Карты', battles: 'Бои' };
  const MIN_BATTLES = [1, 3, 5, 10];
  let _minBattles = Number(localStorage.getItem('sb_min_battles'));
  if (!MIN_BATTLES.includes(_minBattles)) _minBattles = 3;
  let _detail = localStorage.getItem('sb_detail');
  if (!DETAILS[_detail]) _detail = 'vehicles';
  let _data = null;

  const fmt  = v => v == null ? '—' : Number(v).toLocaleString('ru');
  const fmtF = v => v == null ? '—' : Number(v).toLocaleString('ru', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }

  function logout() {
    localStorage.removeItem('sb_token');
    localStorage.removeItem('sb_username');
    window.location.href = '/login';
  }

  function heatClass(val, max) {
    if (!val) return 'heat-none';
    const r = val / max;
    // Brass is reserved for values within a tenth of the column best, so the
    // highlight means something on columns where everyone clusters near the top.
    if (r < 0.25) return 'heat-low';
    if (r < 0.60) return 'heat-mid';
    if (r < 0.90) return 'heat-high';
    return 'heat-top';
  }

  if (_username) {
    document.getElementById('user-name').textContent = _username;
    document.getElementById('user-pill').classList.remove('idle');
  }
  document.getElementById('btn-logout').addEventListener('click', logout);

  document.getElementById('scope').addEventListener('click', e => {
    const btn = e.target.closest('[data-scope]');
    if (!btn) return;
    const mine = btn.dataset.scope === 'mine';
    if (mine === _mineOnly) return;
    _mineOnly = mine;
    document.querySelectorAll('#scope [data-scope]').forEach(b =>
      b.setAttribute('aria-selected', String((b.dataset.scope === 'mine') === mine)));
    load();
  });

  // One delegated listener: #content is replaced on every render, but it survives.
  contentEl.addEventListener('click', e => {
    const detail = e.target.closest('[data-detail]');
    if (detail) {
      if (detail.dataset.detail === _detail) return;
      _detail = detail.dataset.detail;
      localStorage.setItem('sb_detail', _detail);
      return renderDetail();
    }
    const min = e.target.closest('[data-min]');
    if (min) {
      const value = Number(min.dataset.min);
      if (value === _minBattles) return;
      _minBattles = value;
      localStorage.setItem('sb_min_battles', String(value));
      return load();
    }
    const hide = e.target.closest('[data-hide]');
    if (hide) return hidePlayer(hide.dataset.hide);
    const show = e.target.closest('[data-show]');
    if (show) return restorePlayer(show.dataset.show);
    const del = e.target.closest('[data-delete-battle]');
    if (del) return removeBattle(Number(del.dataset.deleteBattle));
  });

  function tableCard(title, meta, headHTML, bodyHTML, asideHTML = '') {
    return `<div class="table-card">
      <div class="table-meta">
        <div><strong>${esc(title)}</strong>${meta ? ` &nbsp;·&nbsp; ${meta}` : ''}</div>
        ${asideHTML}
      </div>
      <div class="table-scroll"><table class="stats">
        <thead>${headHTML}</thead>
        <tbody>${bodyHTML}</tbody>
      </table></div>
    </div>`;
  }

  function render() {
    const { totals, players, hidden = [], players_total = players.length } = _data;
    const total  = Number(totals.total_battles ?? 0);
    const wins   = Number(totals.wins   ?? 0);
    const losses = Number(totals.losses ?? 0);
    const draws  = Number(totals.draws  ?? 0);
    const wr = total ? Math.round(wins   / total * 100) : 0;
    const lr = total ? Math.round(losses / total * 100) : 0;

    contentEl.innerHTML = `
      ${total === 0 ? renderEmpty() : ''}
      ${renderSummary(total, wins, losses, draws, wr, lr, totals, players_total)}
      ${renderHidden(hidden)}
      ${renderPlayers(players)}
      <div id="detail-table"></div>
    `;
    if (total) renderDetail();
  }

  function renderEmpty() {
    return `<div class="empty-state">
      <strong>Пока пусто</strong>
      Загрузи реплеи через <a href="/">Быстрый чек</a> и отметь бои, которые нужно сохранить.
    </div>`;
  }

  function renderSummary(total, wins, losses, draws, wr, lr, totals, playerCount) {
    if (!total) return '';
    const range = totals.first_battle
      ? `${esc(String(totals.first_battle).slice(0, 10))} — ${esc(String(totals.last_battle).slice(0, 10))}`
      : '';
    return `<div class="summary cols-5">
      <div class="stat-card is-accent bracketed">
        <div class="label">Боёв в базе</div>
        <div class="value">${total}</div>
        <div class="delta">${range}</div>
      </div>
      <div class="stat-card is-win bracketed">
        <div class="label">Победы</div>
        <div class="value" style="color:var(--win)">${wins}</div>
        <div class="delta"><strong>${wr}%</strong> побед</div>
        <div class="bar bar-win"><span style="width:${wr}%"></span></div>
      </div>
      <div class="stat-card is-loss bracketed">
        <div class="label">Поражения</div>
        <div class="value" style="color:var(--loss)">${losses}</div>
        <div class="delta"><strong>${lr}%</strong> поражений</div>
        <div class="bar bar-loss"><span style="width:${lr}%"></span></div>
      </div>
      <div class="stat-card is-draw bracketed">
        <div class="label">Ничьи</div>
        <div class="value" style="color:var(--draw)">${draws}</div>
        <div class="delta">${total ? Math.round(draws / total * 100) : 0}%</div>
      </div>
      <div class="stat-card bracketed">
        <div class="label">Игроков</div>
        <div class="value">${playerCount}</div>
        <div class="delta">уникальных</div>
      </div>
    </div>`;
  }

  function renderHidden(hidden) {
    if (!hidden.length) return '';
    return `<div class="hidden-bar">
      <span class="hidden-label">Скрыто из аналитики:</span>
      ${hidden.map(n =>
        `<button class="chip" data-show="${esc(n)}" title="Вернуть в аналитику">${esc(n)} <span>вернуть</span></button>`
      ).join('')}
    </div>`;
  }

  function renderPlayers(players) {
    if (!players.length) {
      const total = Number(_data.players_total ?? 0);
      if (!total) return '';
      return tableCard(
        'Игроки',
        `ни один из ${total} ${plural(total, 'игрока', 'игроков', 'игроков')} не прошёл порог`,
        '', emptyRow('Понизь порог, чтобы увидеть остальных'), minBattlesTabs(),
      );
    }

    const maxOf = key => Math.max(...players.map(p => Number(p[key]) || 0), 1);
    const maxDmg = maxOf('avg_damage'), maxAst = maxOf('avg_assists'), maxBlk = maxOf('avg_blocked');

    // Ratio of the averages, i.e. total hits over total shots - not an average of per-battle ratios.
    const ratio = (a, b) => Number(b) > 0 ? Math.round(Number(a) / Number(b) * 100) : 0;
    const maxAcc = Math.max(...players.map(p => ratio(p.avg_hits, p.avg_shots)), 1);
    const maxPen = Math.max(...players.map(p => ratio(p.avg_piercings, p.avg_hits)), 1);

    const rows = players.map(p => {
      const battles = Number(p.battles);
      const wins    = Number(p.wins);
      const losses  = Number(p.losses);
      const wr      = battles ? Math.round(wins / battles * 100) : 0;
      const dmgDiff = (Number(p.avg_dmg_win) || 0) - (Number(p.avg_dmg_loss) || 0);
      const diffCls = dmgDiff > 100 ? 'delta-pos' : dmgDiff < -100 ? 'delta-neg' : 'delta-neu';
      const diffStr = dmgDiff > 0 ? '+' + fmt(dmgDiff) : fmt(dmgDiff);

      return `<tr>
        <td class="sticky-l">
          <div class="player-name" title="${esc(p.name)}">${esc(p.name)}</div>
          <div class="player-sub">${battles} ${plural(battles, 'бой', 'боя', 'боёв')} · WR ${wr}%</div>
          <div class="winrate-bar">
            <span class="w" style="flex:${wins}"></span>
            <span class="l" style="flex:${losses}"></span>
            <span class="d" style="flex:${Number(p.draws)}"></span>
          </div>
        </td>
        <td class="${heatClass(Number(p.avg_damage),  maxDmg)}">${fmt(p.avg_damage)}</td>
        <td class="${heatClass(Number(p.avg_assists), maxAst)}">${fmt(p.avg_assists)}</td>
        <td class="${heatClass(Number(p.avg_blocked), maxBlk)}">${fmt(p.avg_blocked)}</td>
        <td>${fmt(p.avg_received)}</td>
        <td>${fmtF(p.avg_frags)}</td>
        <td class="${heatClass(ratio(p.avg_hits, p.avg_shots), maxAcc)}">${ratio(p.avg_hits, p.avg_shots)}%</td>
        <td class="${heatClass(ratio(p.avg_piercings, p.avg_hits), maxPen)}">${ratio(p.avg_piercings, p.avg_hits)}%</td>
        <td class="${diffCls}">${diffStr}</td>
        <td><button class="btn-icon" data-hide="${esc(p.name)}" title="Скрыть игрока из аналитики" aria-label="Скрыть игрока">✕</button></td>
      </tr>`;
    }).join('');

    const head = `<tr>
      <th class="sticky-l">Игрок</th>
      <th>Ср. урон</th>
      <th>Ср. ассист</th>
      <th>Ср. заблок</th>
      <th>Ср. получен</th>
      <th>Ср. фраги</th>
      <th>Точность</th>
      <th>% пробитий</th>
      <th title="Средний урон в победах минус средний урон в поражениях">Δ урон</th>
      <th></th>
    </tr>`;

    const total = Number(_data.players_total ?? players.length);
    const shown = players.length === total
      ? `${players.length} ${plural(players.length, 'игрок', 'игрока', 'игроков')}`
      : `${players.length} из ${total}`;
    const meta = `${shown} · сортировка по ср. урону`;
    return tableCard('Игроки', meta, head, rows, minBattlesTabs());
  }

  function minBattlesTabs() {
    return `<div class="filter-group">
      <span class="filter-label">Мин. боёв</span>
      <div class="segmented" role="tablist" aria-label="Минимум боёв">
        ${MIN_BATTLES.map(n =>
          `<button type="button" role="tab" data-min="${n}" aria-selected="${n === _minBattles}">${n}</button>`
        ).join('')}
      </div>
    </div>`;
  }

  function detailTabs() {
    return `<div class="segmented" role="tablist" aria-label="Разрез">
      ${Object.entries(DETAILS).map(([key, label]) =>
        `<button type="button" role="tab" data-detail="${key}" aria-selected="${key === _detail}">${label}</button>`
      ).join('')}
    </div>`;
  }

  function renderDetail() {
    const host = document.getElementById('detail-table');
    if (!host) return;
    const build = { vehicles: renderVehicles, maps: renderMaps, battles: renderBattles }[_detail];
    host.innerHTML = build(_data);
  }

  function renderVehicles({ vehicles }) {
    if (!vehicles.length) return tableCard('Танки', '', '', emptyRow('Нет данных по танкам'), detailTabs());

    const grouped = {};
    vehicles.forEach(v => (grouped[v.name] ??= []).push(v));
    const maxDmg = Math.max(...vehicles.map(v => Number(v.avg_damage) || 0), 1);

    const rows = Object.entries(grouped).map(([name, tanks]) =>
      tanks.map((v, i) => {
        const wr = Number(v.battles) ? Math.round(Number(v.wins) / Number(v.battles) * 100) : 0;
        return `<tr>
          ${i === 0 ? `<td class="sticky-l" rowspan="${tanks.length}"><div class="player-name" title="${esc(name)}">${esc(name)}</div></td>` : ''}
          <td class="col-vehicle"><span class="vehicle-name">${esc(v.vehicle)}</span></td>
          <td>${v.battles}</td>
          <td class="${heatClass(Number(v.avg_damage), maxDmg)}">${fmt(v.avg_damage)}</td>
          <td>${fmt(v.avg_assists)}</td>
          <td>${fmtF(v.avg_frags)}</td>
          <td>${wr}%</td>
        </tr>`;
      }).join('')
    ).join('');

    const head = `<tr>
      <th class="sticky-l">Игрок</th>
      <th class="col-vehicle">Танк</th>
      <th>Боёв</th>
      <th>Ср. урон</th>
      <th>Ср. ассист</th>
      <th>Ср. фраги</th>
      <th>WR%</th>
    </tr>`;
    return tableCard('Игрок × Танк', `${vehicles.length} ${plural(vehicles.length, 'связка', 'связки', 'связок')}`, head, rows, detailTabs());
  }

  function renderMaps({ maps }) {
    if (!maps.length) return tableCard('Карты', '', '', emptyRow('Нет данных по картам'), detailTabs());

    const rows = maps.map(m => {
      const battles = Number(m.battles);
      const wins    = Number(m.wins);
      const losses  = Number(m.losses);
      const draws   = Number(m.draws);
      const wr      = Number(m.winrate);
      const wrCls   = wr >= 55 ? 'delta-pos' : wr <= 40 ? 'delta-neg' : '';

      return `<tr>
        <td class="sticky-l"><div class="player-name" title="${esc(m.map_name)}">${esc(m.map_name)}</div></td>
        <td>${battles}</td>
        <td><span class="badge win">${wins}W</span></td>
        <td><span class="badge loss">${losses}L</span></td>
        <td>${draws}</td>
        <td class="${wrCls}">${wr}%</td>
        <td class="wr-cell">
          <div class="winrate-bar">
            <span class="w" style="flex:${wins}"></span>
            <span class="l" style="flex:${losses}"></span>
            <span class="d" style="flex:${draws}"></span>
          </div>
        </td>
      </tr>`;
    }).join('');

    const head = `<tr>
      <th class="sticky-l">Карта</th>
      <th>Боёв</th>
      <th>Победы</th>
      <th>Поражения</th>
      <th>Ничьи</th>
      <th>WR%</th>
      <th style="min-width:120px">W / L / D</th>
    </tr>`;
    return tableCard('Карты', `${maps.length} ${plural(maps.length, 'карта', 'карты', 'карт')} · сортировка по количеству боёв`, head, rows, detailTabs());
  }

  function renderBattles({ battles }) {
    if (!battles.length) return tableCard('Бои', '', '', emptyRow('Нет сохранённых боёв'), detailTabs());

    const label = { win: 'Победа', loss: 'Поражение', draw: 'Ничья' };

    const rows = battles.map(b => {
      const date = String(b.date_time || '').slice(0, 16).replace('T', ' ');
      const result = b.result === 'draw'
        ? esc(label.draw)
        : `<span class="badge ${b.result}">${esc(label[b.result] ?? b.result)}</span>`;
      return `<tr id="battle-row-${b.id}">
        <td class="cell-date">${esc(date)}</td>
        <td class="sticky-l"><div class="player-name">${esc(b.map_name)}</div></td>
        <td>${result}</td>
        <td style="color:var(--text-muted)">${b.player_count}</td>
        <td>${b.mine ? '<span class="tag-mine">мой</span>' : ''}</td>
        <td class="cell-file" title="${esc(b.filename)}">${esc(b.filename)}</td>
        <td>${b.mine ? `<button class="btn-icon" data-delete-battle="${b.id}" title="Удалить бой из своей истории" aria-label="Удалить бой">✕</button>` : ''}</td>
      </tr>`;
    }).join('');

    const head = `<tr>
      <th>Дата</th>
      <th class="sticky-l">Карта</th>
      <th>Результат</th>
      <th>Игроков</th>
      <th>Мои</th>
      <th>Файл</th>
      <th></th>
    </tr>`;
    return tableCard('Бои', `${battles.length} ${plural(battles.length, 'бой', 'боя', 'боёв')} в базе`, head, rows, detailTabs());
  }

  function emptyRow(text) {
    return `<tr><td style="text-align:center;padding:32px;color:var(--text-muted)">${esc(text)}</td></tr>`;
  }

  async function fail(res) {
    const data = await res.json().catch(() => ({}));
    alert(data.detail ?? `Ошибка ${res.status}`);
  }

  async function removeBattle(id) {
    if (!confirm('Удалить этот бой из своей истории?')) return;
    const res = await api(`/api/battles/${id}`, { method: 'DELETE' });
    res.ok ? load() : fail(res);
  }

  async function hidePlayer(name) {
    if (!confirm(`Скрыть «${name}» из аналитики? Данные боёв останутся в базе.`)) return;
    const res = await api('/api/players/hidden', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    res.ok ? load() : fail(res);
  }

  async function restorePlayer(name) {
    const res = await api(`/api/players/hidden/${encodeURIComponent(name)}`, { method: 'DELETE' });
    res.ok ? load() : fail(res);
  }

  async function load() {
    contentEl.innerHTML = `<div class="spinner-wrap"><div class="spinner"></div> Загружаем данные…</div>`;
    const [summaryRes, battlesRes] = await Promise.all([
      api(`/api/analytics/summary?mine=${_mineOnly}&min_battles=${_minBattles}`),
      api(`/api/battles?mine=${_mineOnly}`),
    ]);
    const data = await summaryRes.json();
    if (data.error) {
      const msg = data.error === 'database_unavailable' ? 'База данных недоступна.' : data.error;
      contentEl.innerHTML = `<div class="empty-state"><strong>Ошибка</strong>${esc(msg)}</div>`;
      return;
    }
    const battlesData = battlesRes.ok ? await battlesRes.json() : { battles: [] };
    _data = { ...data, battles: battlesData.battles ?? [] };
    render();
  }

  load().catch(err => {
    contentEl.innerHTML = `<div class="empty-state"><strong>Ошибка загрузки</strong>${esc(err.message)}</div>`;
  });
</script>
</body>
</html>
