<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>StatsBattle — Мир Танков</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f6feb'/%3E%3Cg fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='6'/%3E%3Cpath d='M12 4v3M12 17v3M4 12h3M17 12h3'/%3E%3C/g%3E%3Ccircle cx='12' cy='12' r='1.8' fill='white'/%3E%3C/svg%3E" />
<meta name="theme-color" content="#0d1117" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/app.css" />
<style>
  /* drop zone */
  .dropzone {
    border: 1.5px dashed var(--border);
    background: radial-gradient(760px 190px at 50% -40%, rgba(31,111,235,0.09), transparent 62%), var(--surface);
    border-radius: 12px; padding: 26px 24px;
    display: flex; align-items: center; gap: 24px; margin-bottom: 24px;
    transition: border-color 0.15s, background 0.15s; cursor: pointer;
  }
  .dropzone:hover, .dropzone.dragover { border-color: var(--accent); }
  .dropzone.dragover { background: radial-gradient(760px 190px at 50% -40%, rgba(31,111,235,0.18), transparent 62%), var(--surface); }
  .dropzone-icon {
    width: 52px; height: 52px; border-radius: 12px;
    background: var(--surface-3); border: 1px solid var(--border);
    display: grid; place-items: center; color: var(--accent-hover); flex-shrink: 0;
  }
  .dropzone-body { flex: 1; min-width: 0; }
  .dropzone-title { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .dropzone-sub { font-size: 13px; color: var(--text-muted); margin: 0; }
  .dropzone-sub code {
    font-family: var(--font-mono); background: var(--surface-3);
    border: 1px solid var(--border); padding: 1px 6px; border-radius: 4px;
    font-size: 11.5px; color: var(--text);
  }
  .dropzone-actions { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
  #file-input { display: none; }

  /* save bar */
  .save-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 20px;
  }
  .save-bar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .save-check {
    display: flex; align-items: center; gap: 7px; font-size: 12px;
    color: var(--text-muted); cursor: pointer; user-select: none;
    background: var(--surface-2); border: 1px solid var(--border-muted);
    border-radius: 999px; padding: 4px 12px 4px 10px;
  }
  .save-check:hover { border-color: var(--border); color: var(--text); }
  .save-check input[type=checkbox] { accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; }
  .save-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .save-status { font-size: 12px; color: var(--text-muted); }

  /* loading */
  .spinner-card {
    background: var(--surface); border: 1px solid var(--border-muted); border-radius: var(--radius);
    padding: 32px; align-items: center; justify-content: center;
    gap: 16px; color: var(--text-muted); font-size: 13px; display: none;
  }
  .spinner-card.visible { display: flex; }

  /* battle column headers */
  table.stats thead th { padding: 0; height: 64px; }
  table.stats thead th.sticky-l, table.stats thead th.sticky-r { padding: 0 16px; }
  .b-head { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 10px; min-width: 84px; }
  .b-map { color: var(--text); font-size: 11px; font-weight: 500; font-family: var(--font); }
  .b-idx { color: var(--text-dim); font-size: 9.5px; font-family: var(--font-mono); }
  .b-vehicle {
    color: var(--accent-hover); font-size: 9.5px; font-family: var(--font); font-weight: 500;
    max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .col-head { display: block; padding: 0 4px; }

  /* player cell */
  .player-meta { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; padding: 6px 0; }

  /* two-line cells */
  .combo-top { display: block; font-size: 12.5px; }
  .combo-bot { display: block; font-size: 10px; color: var(--text-muted); margin-top: 1px; }
  td.cell-combo { height: auto; padding: 6px 10px; line-height: 1.15; }

  td.frag-0 { color: var(--heat-none); }
  td.frag-1 { color: var(--heat-low); }
  td.frag-2 { color: var(--heat-mid); font-weight: 600; }
  td.frag-3 { color: var(--heat-high); font-weight: 700; }
  td.frag-4 { color: var(--heat-top); font-weight: 700; background: var(--heat-top-bg); }

  td.sticky-r .avg-val { font-size: 14px; }
  td.sticky-r .avg-sub {
    display: block; color: var(--text-muted); font-size: 10px;
    font-weight: 400; font-family: var(--font-mono); margin-top: 1px;
  }

  @media (max-width: 900px) {
    .dropzone { flex-direction: column; align-items: stretch; gap: 14px; }
    .dropzone-actions .btn { width: 100%; }
    .save-bar { flex-direction: column; align-items: stretch; }
    .save-actions { justify-content: space-between; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8" stroke="#fff" stroke-width="1.5" opacity="0.95"/>
          <circle cx="12" cy="12" r="2" fill="#fff"/>
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-title">Stats<span class="accent">Battle</span></span>
        <span class="brand-sub">Мир Танков · Replay Analyzer</span>
      </span>
    </a>

    <nav class="nav-links">
      <a href="/" class="nav-link active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Быстрый чек
      </a>
      <a href="/analytics" class="nav-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Аналитика
      </a>
    </nav>

    <div class="header-right">
      <span class="user-pill idle" id="user-pill"><span id="user-name">—</span></span>
      <button class="btn btn-ghost btn-sm" id="btn-logout">Выйти</button>
    </div>
  </header>

  <section class="dropzone" id="dropzone">
    <div class="dropzone-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <div class="dropzone-body">
      <p class="dropzone-title">Перетащи реплеи или нажми для выбора</p>
      <p class="dropzone-sub">Файлы <code>.mtreplay</code> из папки реплеев Мир Танков. Разбор идёт на лету, в базу попадёт только то, что отметишь сам.</p>
    </div>
    <div class="dropzone-actions">
      <button class="btn btn-primary" id="btn-pick">Выбрать файлы</button>
    </div>
    <input type="file" id="file-input" multiple accept=".mtreplay">
  </section>

  <div class="spinner-card" id="loading">
    <div class="spinner"></div>
    <div class="spinner-text">Парсим реплеи…</div>
  </div>

  <div id="main-content" hidden>
    <div class="summary" id="summary"></div>
    <div class="alerts" id="alerts"></div>
    <div class="save-bar" id="save-bar" hidden>
      <div class="save-bar-left" id="save-checks"></div>
      <div class="save-actions">
        <span class="save-status" id="save-status"></span>
        <button class="btn btn-primary" id="btn-save">Сохранить в базу</button>
      </div>
    </div>
    <div id="avg-table"></div>
    <div id="metric-table"></div>
  </div>

</div>

<script>
  // Auth guard
  const _token = localStorage.getItem('sb_token');
  if (!_token) window.location.href = '/login';

  // Player, map and vehicle names come from replay files, so never trust them as markup.
  const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ESCAPES[c]);

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { ...(options.headers ?? {}), 'Authorization': `Bearer ${_token}` },
    });
    if (res.status === 401) { logout(); throw new Error('Сессия истекла'); }
    return res;
  }

  const dropzone    = document.getElementById('dropzone');
  const fileInput   = document.getElementById('file-input');
  const loading     = document.getElementById('loading');
  const mainContent = document.getElementById('main-content');
  const summaryEl   = document.getElementById('summary');
  const saveBar     = document.getElementById('save-bar');
  const saveChecks  = document.getElementById('save-checks');
  const saveStatus  = document.getElementById('save-status');
  const btnSave     = document.getElementById('btn-save');
  const alertsEl    = document.getElementById('alerts');
  const avgEl       = document.getElementById('avg-table');
  const metricEl    = document.getElementById('metric-table');

  let _parsedBattles = [];
  let _rows = [];
  let _battles = [];

  const METRICS = {
    damage:   { sortKey: 'avgDamage',   title: 'Урон',        col: 'Ср. урон ↓' },
    assists:  { sortKey: 'avgAssists',  title: 'Ассист',      col: 'Ср. ассист ↓' },
    combo:    { sortKey: 'avgBlocked',  title: 'Броня',       col: 'Заблок ↓ / Получен' },
    frags:    { sortKey: 'avgFrags',    title: 'Фраги',       col: 'Ср. фраги ↓' },
    accuracy: { sortKey: 'accuracy',    title: 'Точность',    col: 'Точность ↓' },
  };
  let _metric = localStorage.getItem('sb_metric');
  if (!METRICS[_metric]) _metric = 'damage';

  const _username = localStorage.getItem('sb_username') ?? '';
  if (_username) {
    document.getElementById('user-name').textContent = _username;
    document.getElementById('user-pill').classList.remove('idle');
  }

  function logout() {
    localStorage.removeItem('sb_token');
    localStorage.removeItem('sb_username');
    window.location.href = '/login';
  }

  const resultLabel = { win: 'WIN', loss: 'LOSS', draw: 'DRAW' };

  function avgInt(arr) {
    const vals = arr.filter(v => v !== null);
    return vals.length ? Math.round(vals.reduce((s, v) => s + v, 0) / vals.length) : 0;
  }
  function avgFloat(arr) {
    const vals = arr.filter(v => v !== null);
    return vals.length ? Math.round(vals.reduce((s, v) => s + v, 0) / vals.length * 10) / 10 : 0;
  }
  function heatClass(val, colMax) {
    if (!val) return 'heat-none';
    const r = val / colMax;
    if (r < 0.25) return 'heat-low';
    if (r < 0.55) return 'heat-mid';
    if (r < 0.85) return 'heat-high';
    return 'heat-top';
  }
  function fmtFrags(v) {
    return v.toLocaleString('ru', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }
  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }

  document.getElementById('btn-logout').addEventListener('click', logout);
  document.getElementById('btn-save').addEventListener('click', saveBattles);
  document.getElementById('btn-pick').addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault(); dropzone.classList.remove('dragover');
    uploadFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', () => uploadFiles(fileInput.files));

  saveChecks.addEventListener('change', updateSaveBtn);

  // The metric card is rebuilt on every switch, so listen on its stable container.
  metricEl.addEventListener('click', e => {
    const tab = e.target.closest('[data-metric]');
    if (!tab || tab.dataset.metric === _metric) return;
    _metric = tab.dataset.metric;
    localStorage.setItem('sb_metric', _metric);
    renderMetricCard();
  });

  async function uploadFiles(files) {
    if (!files.length) return;
    const fd = new FormData();
    for (const f of files) fd.append('files', f);
    loading.classList.add('visible');
    mainContent.hidden = true;
    saveBar.hidden = true;
    alertsEl.innerHTML = '';
    _parsedBattles = [];
    try {
      const res = await api('/api/upload', { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) { showAlert(`Ошибка сервера ${res.status}`, data?.detail ?? JSON.stringify(data)); return; }
      renderAll(data);
    } catch (e) {
      showAlert('Ошибка соединения', e.message);
    } finally {
      loading.classList.remove('visible');
    }
  }

  const WARN_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>
    </svg>`;

  function alertBox(title, body, kind = '') {
    return `<div class="alert ${kind}">
      <div class="alert-icon">${kind === 'info' ? INFO_ICON : WARN_ICON}</div>
      <div class="alert-body"><div class="alert-title">${title}</div><div class="alert-text">${body}</div></div>
      <button class="alert-dismiss" onclick="this.closest('.alert').remove()" aria-label="Скрыть">×</button>
    </div>`;
  }

  function showAlert(title, text) {
    alertsEl.innerHTML = alertBox(esc(title), esc(text));
    mainContent.hidden = false;
  }

  const INFO_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.5" r=".6" fill="currentColor"/>
    </svg>`;

  function buildSaveBar(battles) {
    const LABELS = { win: 'Победа', loss: 'Поражение', draw: 'Ничья' };
    saveChecks.innerHTML = battles.map((b, i) => `
      <label class="save-check">
        <input type="checkbox" data-i="${i}" checked>
        <span>${esc(b.map_name)} — ${esc(LABELS[b.result] ?? b.result)} (${esc(b.date_time.slice(0, 10))})</span>
      </label>`).join('');
    saveStatus.textContent = '';
    btnSave.disabled = false;
    saveBar.hidden = false;
  }

  function updateSaveBtn() {
    const checked = saveChecks.querySelectorAll('input:checked').length;
    btnSave.disabled = checked === 0;
    if (!btnSave.disabled) saveStatus.textContent = '';
  }

  async function saveBattles() {
    const selected = [...saveChecks.querySelectorAll('input:checked')]
      .map(cb => _parsedBattles[+cb.dataset.i]);
    if (!selected.length) return;
    btnSave.disabled = true;
    saveStatus.textContent = 'Сохранение…';
    try {
      const res = await api('/api/battles/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ battles: selected }),
      });
      const data = await res.json();
      if (!res.ok) { saveStatus.textContent = `Ошибка: ${data?.detail ?? res.status}`; btnSave.disabled = false; return; }
      const parts = [];
      if (data.created) parts.push(`новых боёв: ${data.created}`);
      if (data.linked)  parts.push(`добавлено к тебе: ${data.linked}`);
      if (data.skipped) parts.push(`уже были: ${data.skipped}`);
      saveStatus.textContent = '✓ ' + (parts.join(', ') || 'ничего не изменилось');
      saveChecks.querySelectorAll('input:checked').forEach(cb => {
        cb.disabled = true;
        cb.closest('label').style.opacity = '0.4';
      });
    } catch (e) {
      saveStatus.textContent = `Ошибка: ${e.message}`;
      btnSave.disabled = false;
    }
  }

  function renderAll({ battles = [], errors = [] }) {
    // An unfinished replay has a roster but no results; counting it would add a
    // phantom draw and a column of zeros, so it is reported instead of charted.
    const incomplete = battles.filter(b => b.complete === false);
    battles = battles.filter(b => b.complete !== false);

    const notices = [];
    if (errors.length) {
      notices.push(alertBox(
        `${errors.length} ${plural(errors.length, 'реплей', 'реплея', 'реплеев')} не удалось разобрать`,
        errors.map(e => `<code>${esc(e.file)}</code> — ${esc(e.error)}`).join(' &middot; '),
      ));
    }
    if (incomplete.length) {
      notices.push(alertBox(
        `${incomplete.length} ${plural(incomplete.length, 'реплей', 'реплея', 'реплеев')} без результатов боя`,
        `Запись оборвалась до конца боя, статистики в ней нет: ${incomplete.map(b => `<code>${esc(b.filename)}</code>`).join(' &middot; ')}`,
        'info',
      ));
    }
    alertsEl.innerHTML = notices.join('');

    if (!battles.length) {
      mainContent.hidden = false;
      saveBar.hidden = true;
      summaryEl.innerHTML = '';
      avgEl.innerHTML = '';
      metricEl.innerHTML = '';
      return;
    }

    _parsedBattles = battles;
    buildSaveBar(battles);

    const wins   = battles.filter(b => b.result === 'win').length;
    const losses = battles.filter(b => b.result === 'loss').length;
    const draws  = battles.filter(b => b.result === 'draw').length;
    const total  = battles.length;
    const winPct  = Math.round(wins   / total * 100);
    const lossPct = Math.round(losses / total * 100);
    const drawPct = Math.round(draws  / total * 100);

    summaryEl.innerHTML = `
      <div class="stat-card">
        <div class="label"><span class="dot neutral"></span> Боёв</div>
        <div class="value">${total}</div>
        <div class="delta">${plural(total, 'реплей', 'реплея', 'реплеев')} загружено</div>
      </div>
      <div class="stat-card">
        <div class="label"><span class="dot win"></span> Победы</div>
        <div class="value" style="color:var(--win)">${wins}</div>
        <div class="delta"><strong>${winPct}%</strong> побед</div>
        <div class="bar bar-win"><span style="width:${winPct}%"></span></div>
      </div>
      <div class="stat-card">
        <div class="label"><span class="dot loss"></span> Поражения</div>
        <div class="value" style="color:var(--loss)">${losses}</div>
        <div class="delta"><strong>${lossPct}%</strong> поражений</div>
        <div class="bar bar-loss"><span style="width:${lossPct}%"></span></div>
      </div>
      <div class="stat-card">
        <div class="label"><span class="dot draw"></span> Ничьи</div>
        <div class="value" style="color:var(--draw)">${draws}</div>
        <div class="delta"><strong>${drawPct}%</strong> ничьих</div>
        <div class="bar bar-draw"><span style="width:${drawPct}%"></span></div>
      </div>`;

    _battles = [...battles].reverse();
    const n = _battles.length;
    const playerMap = new Map();

    _battles.forEach((b, bi) => {
      b.players.filter(p => p.team === b.player_team).forEach(p => {
        if (!playerMap.has(p.name)) {
          playerMap.set(p.name, {
            damage:    new Array(n).fill(null),
            assists:   new Array(n).fill(null),
            blocked:   new Array(n).fill(null),
            received:  new Array(n).fill(null),
            frags:     new Array(n).fill(null),
            shots:     new Array(n).fill(null),
            hits:      new Array(n).fill(null),
            piercings: new Array(n).fill(null),
          });
        }
        const s = playerMap.get(p.name);
        s.damage[bi]    = p.damage_dealt    ?? null;
        s.assists[bi]   = p.assists         ?? null;
        s.blocked[bi]   = p.blocked         ?? null;
        s.received[bi]  = p.damage_received ?? null;
        s.frags[bi]     = p.frags           ?? null;
        s.shots[bi]     = p.shots           ?? null;
        s.hits[bi]      = p.hits            ?? null;
        s.piercings[bi] = p.piercings       ?? null;
      });
    });

    _rows = [];
    playerMap.forEach((stats, name) => {
      const played = stats.damage.filter(v => v !== null).length;
      const avgShots     = avgFloat(stats.shots);
      const avgHits      = avgFloat(stats.hits);
      const avgPiercings = avgFloat(stats.piercings);
      _rows.push({ name, stats, played,
        avgDamage:   avgInt(stats.damage),
        avgAssists:  avgInt(stats.assists),
        avgBlocked:  avgInt(stats.blocked),
        avgReceived: avgInt(stats.received),
        avgFrags:    avgFloat(stats.frags),
        avgShots,
        avgHits,
        avgPiercings,
        accuracy:    avgShots > 0 ? Math.round(avgHits      / avgShots * 100) : 0,
        penetration: avgHits  > 0 ? Math.round(avgPiercings / avgHits  * 100) : 0,
      });
    });

    avgEl.innerHTML = buildAvgTable(_rows, _battles);
    renderMetricCard();
    mainContent.hidden = false;
  }

  function playerCell(name, played, total) {
    return `<td class="sticky-l"><div class="player-meta">
      <span class="player-name" title="${esc(name)}">${esc(name)}</span>
      <span class="player-sub">${played} из ${total} ${plural(total, 'боя', 'боёв', 'боёв')}</span>
    </div></td>`;
  }

  function tableCard(title, meta, headHTML, bodyHTML, asideHTML = '') {
    return `<div class="table-card">
      <div class="table-meta">
        <div><strong>${esc(title)}</strong> &nbsp;·&nbsp; ${esc(meta)}</div>
        ${asideHTML}
      </div>
      <div class="table-scroll"><table class="stats">
        <thead>${headHTML}</thead>
        <tbody>${bodyHTML}</tbody>
      </table></div>
    </div>`;
  }

  function buildAvgTable(rows, battles) {
    const sorted = [...rows].sort((a, b) => b.avgDamage - a.avgDamage);
    const max = key => Math.max(...rows.map(r => r[key]), 1);
    const [maxDmg, maxAst, maxBlk, maxRcv, maxFrg, maxAcc, maxPen] =
      ['avgDamage', 'avgAssists', 'avgBlocked', 'avgReceived', 'avgFrags', 'accuracy', 'penetration'].map(max);

    const head = `<tr>
      <th class="sticky-l">Игрок</th>
      <th><span class="col-head">Ср. урон</span></th>
      <th><span class="col-head">Ср. ассист</span></th>
      <th><span class="col-head">Ср. заблок</span></th>
      <th><span class="col-head">Ср. получен</span></th>
      <th><span class="col-head">Ср. фраги</span></th>
      <th><span class="col-head">Точность</span></th>
      <th><span class="col-head">% пробитий</span></th>
    </tr>`;

    const body = sorted.map(r => `<tr>
      ${playerCell(r.name, r.played, battles.length)}
      <td class="dmg ${heatClass(r.avgDamage,   maxDmg)}">${r.avgDamage.toLocaleString('ru')}</td>
      <td class="dmg ${heatClass(r.avgAssists,  maxAst)}">${r.avgAssists.toLocaleString('ru')}</td>
      <td class="dmg ${heatClass(r.avgBlocked,  maxBlk)}">${r.avgBlocked.toLocaleString('ru')}</td>
      <td class="${heatClass(r.avgReceived, maxRcv)}">${r.avgReceived.toLocaleString('ru')}</td>
      <td class="${heatClass(r.avgFrags,    maxFrg)}">${fmtFrags(r.avgFrags)}</td>
      <td class="${heatClass(r.accuracy,    maxAcc)}">${r.accuracy}%</td>
      <td class="${heatClass(r.penetration, maxPen)}">${r.penetration}%</td>
    </tr>`).join('');

    const meta = `${sorted.length} ${plural(sorted.length, 'игрок', 'игрока', 'игроков')} · ${battles.length} ${plural(battles.length, 'бой', 'боя', 'боёв')}`;
    return tableCard('Средние показатели', meta, head, body);
  }

  function metricTabs() {
    return `<div class="segmented" role="tablist" aria-label="Метрика">
      ${Object.entries(METRICS).map(([key, cfg]) =>
        `<button type="button" role="tab" data-metric="${key}" aria-selected="${key === _metric}">${cfg.title}</button>`
      ).join('')}
    </div>`;
  }

  function renderMetricCard() {
    metricEl.innerHTML = _rows.length ? buildMetricTable(_metric, _rows, _battles) : '';
  }

  function buildMetricTable(metric, rows, battles) {
    const cfg = METRICS[metric];
    const sorted = [...rows].sort((a, b) => b[cfg.sortKey] - a[cfg.sortKey]);

    const headCols = battles.map((b, bi) => `<th><div class="b-head">
      <span class="badge ${b.result || 'draw'}">${resultLabel[b.result] ?? '?'}</span>
      <span class="b-map" title="${esc(b.map_name)}">${esc(b.map_name.length > 10 ? b.map_name.slice(0, 9) + '…' : b.map_name)}</span>
      ${b.player_vehicle ? `<span class="b-vehicle" title="${esc(b.player_vehicle)}">${esc(b.player_vehicle.length > 12 ? b.player_vehicle.slice(0, 11) + '…' : b.player_vehicle)}</span>` : ''}
      <span class="b-idx">#${String(bi + 1).padStart(2, '0')}</span>
    </div></th>`).join('');

    const head = `<tr>
      <th class="sticky-l">Игрок</th>
      ${headCols}
      <th class="sticky-r">${cfg.col}</th>
    </tr>`;

    const colMaxOf = key => battles.map((_, bi) => Math.max(...rows.map(r => r.stats[key][bi] ?? 0), 1));
    const colMax = {
      damage: 'damage', assists: 'assists', combo: 'blocked', accuracy: 'shots',
    }[metric];
    const maxes = colMax ? colMaxOf(colMax) : [];

    const body = sorted.map(r => {
      let cells = '', avgCell = '';

      if (metric === 'damage' || metric === 'assists') {
        const key = metric === 'damage' ? 'damage' : 'assists';
        cells = r.stats[key].map((v, bi) =>
          v === null ? `<td class="heat-none">—</td>` :
          `<td class="dmg ${heatClass(v, maxes[bi])}">${v.toLocaleString('ru')}</td>`
        ).join('');
        const avg = metric === 'damage' ? r.avgDamage : r.avgAssists;
        avgCell = `<span class="avg-val">${avg.toLocaleString('ru')}</span><span class="avg-sub">${r.played} ${plural(r.played, 'бой', 'боя', 'боёв')}</span>`;

      } else if (metric === 'combo') {
        cells = r.stats.blocked.map((bl, bi) => {
          if (bl == null) return `<td class="heat-none">—</td>`;
          const rc = r.stats.received[bi];
          return `<td class="cell-combo ${heatClass(bl, maxes[bi])}">
            <span class="combo-top">${bl.toLocaleString('ru')}</span>
            <span class="combo-bot">${(rc ?? 0).toLocaleString('ru')}</span>
          </td>`;
        }).join('');
        avgCell = `<span class="avg-val">${r.avgBlocked.toLocaleString('ru')}</span><span class="avg-sub">${r.avgReceived.toLocaleString('ru')} пол.</span>`;

      } else if (metric === 'frags') {
        cells = r.stats.frags.map(f => {
          if (f === null) return `<td class="heat-none">—</td>`;
          const cls = f === 0 ? 'frag-0' : f === 1 ? 'frag-1' : f === 2 ? 'frag-2' : f === 3 ? 'frag-3' : 'frag-4';
          return `<td class="${cls}">${f}</td>`;
        }).join('');
        avgCell = `<span class="avg-val">${fmtFrags(r.avgFrags)}</span><span class="avg-sub">${r.played} ${plural(r.played, 'бой', 'боя', 'боёв')}</span>`;

      } else {
        cells = r.stats.shots.map((sh, bi) => {
          if (sh === null) return `<td class="heat-none">—</td>`;
          const hi = r.stats.hits[bi] ?? 0;
          const pi = r.stats.piercings[bi] ?? 0;
          const acc = sh > 0 ? Math.round(hi / sh * 100) : 0;
          return `<td class="cell-combo ${heatClass(sh, maxes[bi])}">
            <span class="combo-top">${sh} · ${acc}%</span>
            <span class="combo-bot">${hi}п / ${pi}проб</span>
          </td>`;
        }).join('');
        avgCell = `<span class="avg-val">${r.accuracy}%</span><span class="avg-sub">${r.penetration}% проб</span>`;
      }

      return `<tr>
        ${playerCell(r.name, r.played, battles.length)}
        ${cells}
        <td class="sticky-r">${avgCell}</td>
      </tr>`;
    }).join('');

    const meta = `${sorted.length} ${plural(sorted.length, 'игрок', 'игрока', 'игроков')} × ${battles.length} ${plural(battles.length, 'бой', 'боя', 'боёв')}`;
    return tableCard(cfg.title, meta, head, body, metricTabs());
  }
</script>
</body>
</html>
