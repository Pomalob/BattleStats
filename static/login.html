<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>StatsBattle — Вход</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/app.css" />
<style>
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background:
      radial-gradient(900px 460px at 50% -12%, rgba(31, 111, 235, 0.16), transparent 62%),
      var(--bg);
  }
  .card {
    width: 100%; max-width: 380px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 30px 28px 26px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
  }
  .card-brand { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 24px; }
  .card-brand .brand-title { font-size: 24px; }
  .card-brand .brand-sub { text-align: center; }

  .tabs { display: flex; gap: 3px; padding: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 22px; }
  .tabs button {
    flex: 1; font-family: inherit; font-size: 13px; font-weight: 500;
    padding: 8px 0; border: 0; border-radius: var(--radius-sm);
    background: transparent; color: var(--text-muted); cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500; margin-bottom: 6px;
  }
  .field input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: inherit; font-size: 14px;
    padding: 10px 12px; border-radius: var(--radius-sm);
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .field input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.2);
  }
  .field input::placeholder { color: var(--text-dim); }

  .hint { font-size: 11.5px; color: var(--text-dim); margin: -8px 0 18px; }

  .error {
    display: none; background: var(--loss-bg); border: 1px solid var(--loss-border);
    color: var(--loss); font-size: 12.5px; padding: 9px 12px;
    border-radius: var(--radius-sm); margin-bottom: 16px;
  }
  .error.visible { display: block; }

  .card .btn-primary { width: 100%; padding: 11px 16px; font-size: 14px; }
</style>
</head>
<body>
<main class="card">
  <div class="card-brand">
    <span class="brand-mark">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="8" stroke="#fff" stroke-width="1.5" opacity="0.95"/>
        <circle cx="12" cy="12" r="2" fill="#fff"/>
        <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="brand-text" style="align-items:center">
      <span class="brand-title">Stats<span class="accent">Battle</span></span>
      <span class="brand-sub">Мир Танков · статистика по реплеям</span>
    </span>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-login" data-mode="login" aria-selected="true">Войти</button>
    <button type="button" role="tab" id="tab-register" data-mode="register" aria-selected="false">Регистрация</button>
  </div>

  <div id="error-msg" class="error" role="alert"></div>

  <form id="auth-form" novalidate>
    <div class="field">
      <label for="username">Имя пользователя</label>
      <input type="text" id="username" name="username" autocomplete="username" placeholder="nickname" />
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••" />
    </div>
    <p class="hint" id="hint" hidden>От 3 символов в имени, от 6 — в пароле.</p>

    <button class="btn btn-primary" id="submit-btn" type="submit">Войти</button>
  </form>
</main>

<script>
  let mode = 'login';

  const errEl    = document.getElementById('error-msg');
  const btn      = document.getElementById('submit-btn');
  const hintEl   = document.getElementById('hint');
  const passEl   = document.getElementById('password');

  document.querySelectorAll('.tabs button').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.mode));
  });

  function switchTab(m) {
    mode = m;
    document.querySelectorAll('.tabs button').forEach(t =>
      t.setAttribute('aria-selected', String(t.dataset.mode === m)));
    btn.textContent = m === 'login' ? 'Войти' : 'Зарегистрироваться';
    passEl.autocomplete = m === 'login' ? 'current-password' : 'new-password';
    hintEl.hidden = m === 'login';
    errEl.classList.remove('visible');
  }

  document.getElementById('auth-form').addEventListener('submit', async e => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = passEl.value;

    errEl.classList.remove('visible');
    btn.disabled = true;

    try {
      const res = await fetch(`/api/auth/${mode}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        errEl.textContent = data.detail ?? `Ошибка ${res.status}`;
        errEl.classList.add('visible');
        return;
      }
      localStorage.setItem('sb_token', data.token);
      localStorage.setItem('sb_username', data.username);
      window.location.href = '/';
    } catch (e) {
      errEl.textContent = e.message;
      errEl.classList.add('visible');
    } finally {
      btn.disabled = false;
    }
  });

  // redirect if already logged in
  if (localStorage.getItem('sb_token')) window.location.href = '/';
</script>
</body>
</html>
