<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>StatsBattle — Вход</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f6feb'/%3E%3Cg fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='6'/%3E%3Cpath d='M12 4v3M12 17v3M4 12h3M17 12h3'/%3E%3C/g%3E%3Ccircle cx='12' cy='12' r='1.8' fill='white'/%3E%3C/svg%3E" />
<meta name="theme-color" content="#0d1117" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/app.css" />
<style>
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
  }
  /* A wider plate than a lone card: identity on the left, the form on the right. */
  .plate {
    width: 100%; max-width: 720px;
    display: grid; grid-template-columns: 1fr 300px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }

  .plate-side {
    padding: 30px 28px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 22px;
    background:
      linear-gradient(180deg, rgba(200, 146, 47, 0.05), transparent 45%),
      var(--surface-2);
  }
  .plate-brand { display: flex; align-items: center; gap: 12px; }
  .plate-brand .brand-title { font-size: 25px; }

  .pitch { font-size: 13px; color: var(--text-muted); line-height: 1.55; margin: 0; }
  .pitch b { color: var(--text); font-weight: 500; }

  .facts { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
  .fact { display: flex; align-items: baseline; gap: 10px; }
  .fact dt {
    font-family: var(--font-display); font-size: 10.5px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap;
  }
  .fact dd {
    margin: 0; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted);
    border-bottom: 1px dashed var(--border); flex: 1;
  }

  .plate-form { padding: 30px 28px; display: flex; flex-direction: column; }
  /* the form stretches so the button lines up with the bottom of the left panel */
  #auth-form { display: flex; flex-direction: column; flex: 1; }

  .tabs {
    display: flex; gap: 2px; padding: 2px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 20px;
  }
  .tabs button {
    flex: 1; font-family: var(--font-display); font-size: 12px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.07em;
    padding: 8px 0; border: 0; border-radius: 1px;
    background: transparent; color: var(--text-muted); cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #17120a; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-family: var(--font-display); font-size: 10.5px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.11em; margin-bottom: 6px;
  }
  .field input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: var(--font-mono); font-size: 13.5px;
    padding: 10px 12px; border-radius: var(--radius-sm);
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .field input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(200, 146, 47, 0.16);
  }
  .field input::placeholder { color: var(--heat-none); }

  .hint { font-size: 11.5px; color: var(--text-dim); margin: -4px 0 14px; }

  .error {
    display: none; background: var(--loss-bg); border: 1px solid var(--loss-border);
    border-left-width: 2px; color: var(--loss); font-size: 12.5px; padding: 9px 12px;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-bottom: 14px;
  }
  .error.visible { display: block; }

  .plate-form .btn-primary { width: 100%; padding: 12px 16px; font-size: 14px; margin-top: auto; }

  @media (max-width: 680px) {
    .plate { grid-template-columns: 1fr; max-width: 380px; }
    .plate-side { border-right: 0; border-bottom: 1px solid var(--border); padding: 24px 22px; }
    .facts { display: none; }
    .plate-form { padding: 24px 22px; }
  }
</style>
</head>
<body>
<main class="plate bracketed">
  <section class="plate-side">
    <div class="plate-brand">
      <span class="brand-mark">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="2" fill="currentColor"/>
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-title">Stats<span class="accent">Battle</span></span>
        <span class="brand-sub">Мир Танков</span>
      </span>
    </div>

    <p class="pitch">
      Разбор реплеев <b>.mtreplay</b> по взводу и клану: урон, ассист, заблокированное,
      фраги и точность — по каждому бою и в среднем за всё время.
    </p>

    <dl class="facts">
      <div class="fact"><dt>Формат</dt><dd>.mtreplay</dd></div>
      <div class="fact"><dt>Метрик</dt><dd>8 на игрока</dd></div>
      <div class="fact"><dt>Файлы</dt><dd>на диск не пишутся</dd></div>
    </dl>
  </section>

  <section class="plate-form">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-login" data-mode="login" aria-selected="true">Войти</button>
      <button type="button" role="tab" id="tab-register" data-mode="register" aria-selected="false">Регистрация</button>
    </div>

    <div id="error-msg" class="error" role="alert"></div>

    <form id="auth-form" novalidate>
      <div class="field">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="nickname" />
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••" />
      </div>
      <p class="hint" id="hint" hidden>От 3 символов в имени, от 6 — в пароле.</p>

      <button class="btn btn-primary" id="submit-btn" type="submit">Войти</button>
    </form>
  </section>
</main>

<script>
  let mode = 'login';

  const errEl    = document.getElementById('error-msg');
  const btn      = document.getElementById('submit-btn');
  const hintEl   = document.getElementById('hint');
  const passEl   = document.getElementById('password');

  document.querySelectorAll('.tabs button').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.mode));
  });

  function switchTab(m) {
    mode = m;
    document.querySelectorAll('.tabs button').forEach(t =>
      t.setAttribute('aria-selected', String(t.dataset.mode === m)));
    btn.textContent = m === 'login' ? 'Войти' : 'Зарегистрироваться';
    passEl.autocomplete = m === 'login' ? 'current-password' : 'new-password';
    hintEl.hidden = m === 'login';
    errEl.classList.remove('visible');
  }

  document.getElementById('auth-form').addEventListener('submit', async e => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = passEl.value;

    errEl.classList.remove('visible');
    btn.disabled = true;

    try {
      const res = await fetch(`/api/auth/${mode}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        errEl.textContent = data.detail ?? `Ошибка ${res.status}`;
        errEl.classList.add('visible');
        return;
      }
      localStorage.setItem('sb_token', data.token);
      localStorage.setItem('sb_username', data.username);
      window.location.href = '/';
    } catch (e) {
      errEl.textContent = e.message;
      errEl.classList.add('visible');
    } finally {
      btn.disabled = false;
    }
  });

  // redirect if already logged in
  if (localStorage.getItem('sb_token')) window.location.href = '/';
</script>
</body>
</html>
