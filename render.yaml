services:
  - type: web
    name: battlestats
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENV
        value: production
      # Generated once by Render and then kept; changing it signs everyone out.
      - key: SECRET_KEY
        generateValue: true
      # Paste the Neon connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
